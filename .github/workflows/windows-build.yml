name: Build Windows YU-Destek

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.5"
          architecture: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          doNotCache: true

      - name: Build YU-Destek Windows
        run: |
          python ./build.py --portable --flutter --skip-portable-pack
          mkdir -p output
          cp rustdesk-*-install.exe ./output/YU-Destek-install.exe || true
          cp rustdesk_portable.exe ./output/YU-Destek-portable.exe || true
        shell: bash

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yudestek-windows-x64
          path: ./output/
